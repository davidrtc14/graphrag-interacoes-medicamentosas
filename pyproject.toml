[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-interacoes"
version = "0.1.0"
description = "Assistente GraphRAG de interações medicamentosas (projeto acadêmico)"
requires-python = ">=3.11"

[project.scripts]
graphrag = "graphrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_tmp"
markers = ["integracao: exige o Neo4j de teste (docker compose --profile test up -d)"]
